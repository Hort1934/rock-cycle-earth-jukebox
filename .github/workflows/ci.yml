name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (ES modules)
        run: npm run lint

      - name: Catalog, media and page checks
        run: npm run check

      - name: HTML validation
        run: npx --yes html-validate@9 index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools compile
        run: python -m py_compile tools/build_media.py tools/serve.py
